name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        name: Route documentation-only pull requests
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          code = True
          if os.environ["EVENT"] == "pull_request":
              paths = subprocess.check_output(
                  ["git", "diff", "--name-only", "-z", os.environ["BASE_SHA"] + "...HEAD"]
              ).decode().split("\0")
              paths = [p for p in paths if p]
              code = not paths or any(not (p.endswith(".md") or p == "LICENSE") for p in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"code={str(code).lower()}\n")
          PY

  shell-syntax:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Parse shell scripts without executing them
        run: |
          git ls-files -z '*.sh' '*PKGBUILD' | while IFS= read -r -d '' file; do
            bash -n "$file"
          done

  patch-applies:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: patch-applies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: "Apply SPI PIO patch to CachyOS source (fallback: torvalds)"
        env:
          MAINLINE_SPI_URL: https://raw.githubusercontent.com/torvalds/linux/master/drivers/spi/spi-pxa2xx-pci.c
        run: |
          set -euo pipefail

          PATCH="${GITHUB_WORKSPACE}/kernel/linux-cachyos-mb81/0001-spi-pxa2xx-pci-disable-dma-macbook8-1.patch"
          test -f "$PATCH"

          CACHYOS_SRC=$(sed -n 's/^CACHYOS_SRC=//p' kernel/upstream.pin | tr -d ' \t\r')
          test -n "$CACHYOS_SRC"
          TARBALL_URL="https://github.com/CachyOS/linux/releases/download/${CACHYOS_SRC}/${CACHYOS_SRC}.tar.gz"

          SPI_REL="drivers/spi/spi-pxa2xx-pci.c"
          WORK="${RUNNER_TEMP}/spi-check"
          mkdir -p "$WORK"
          cd "$WORK"

          if ! command -v patch >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y patch
          fi

          apply_patch() {
            local root="$1"
            (
              cd "$root"
              echo "dry-run in ${root}:"
              patch -p1 --dry-run < "$PATCH"
              echo "applying in ${root}:"
              patch -p1 < "$PATCH"
            )
          }

          kernel_root_from_spi() {
            local spi_file="$1"
            printf '%s\n' "${spi_file%/${SPI_REL}}"
          }

          used_fallback=0

          echo "Downloading ${TARBALL_URL}"
          if curl -L --fail --retry 3 --retry-delay 5 --show-error \
            --connect-timeout 30 --max-time 600 \
            -o "${CACHYOS_SRC}.tar.gz" "$TARBALL_URL"; then
            echo "Extracting only ${SPI_REL}"
            if tar -xf "${CACHYOS_SRC}.tar.gz" --wildcards --wildcards-match-slash "*/${SPI_REL}"; then
              :
            elif tar -xf "${CACHYOS_SRC}.tar.gz" --wildcards --no-anchored "$SPI_REL"; then
              :
            else
              echo "Extract of ${SPI_REL} from CachyOS tarball failed; falling back to torvalds/linux"
              used_fallback=1
            fi
          else
            echo "CachyOS tarball download failed (404 or network); falling back to torvalds/linux"
            used_fallback=1
          fi

          if [ "$used_fallback" -eq 0 ]; then
            SPI_FILE=$(find . -path "*/${SPI_REL}" -type f -print -quit)
            if [ -z "$SPI_FILE" ]; then
              echo "Tarball downloaded but ${SPI_REL} was not found; falling back to torvalds/linux"
              used_fallback=1
            else
              ROOT=$(kernel_root_from_spi "$SPI_FILE")
              [ -n "$ROOT" ] || ROOT="."
              echo "Applying patch against CachyOS tree at ${ROOT}"
              apply_patch "$ROOT"
              echo "Patch applied cleanly to ${CACHYOS_SRC}"
              exit 0
            fi
          fi

          echo "Fallback: fetching ${MAINLINE_SPI_URL}"
          mkdir -p fake/"$(dirname "$SPI_REL")"
          curl -L --fail --retry 3 --retry-delay 5 --show-error \
            --connect-timeout 30 --max-time 120 \
            -o "fake/${SPI_REL}" "$MAINLINE_SPI_URL"
          echo "Applying patch against fake torvalds tree"
          apply_patch fake
          echo "Patch applied cleanly to torvalds/linux master fallback"

  pkgbuild-sanity:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: pkgbuild-sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Sanity-check linux-cachyos-mb81 PKGBUILD
        run: |
          set -euo pipefail
          PKG=kernel/linux-cachyos-mb81/PKGBUILD
          test -f "$PKG"
          fail=0

          require() {
            local pat="$1"
            local msg="$2"
            if ! grep -q -- "$pat" "$PKG"; then
              echo "::error file=${PKG}::${msg}"
              fail=1
            else
              echo "ok: ${msg}"
            fi
          }

          require '_pkgsuffix=cachyos-mb81' 'PKGBUILD must set _pkgsuffix=cachyos-mb81'
          require 'GENERIC_V3' 'PKGBUILD must mention GENERIC_V3'
          require '0001-spi-pxa2xx-pci-disable-dma-macbook8-1.patch' 'PKGBUILD must list the SPI PIO patch'

          if grep -F 'replaces=(linux-cachyos-lto)' "$PKG"; then
            echo "::error file=${PKG}::PKGBUILD must not contain replaces=(linux-cachyos-lto)"
            fail=1
          fi
          if grep -E 'replaces=\(linux-cachyos\)' "$PKG"; then
            echo "::error file=${PKG}::PKGBUILD must not contain replaces=(linux-cachyos)"
            fail=1
          fi

          if grep -F '_processor_opt:=}' "$PKG"; then
            echo "::error file=${PKG}::empty _processor_opt default slipped back; must be GENERIC_V3"
            fail=1
          fi
          if ! grep -F '_processor_opt:=GENERIC_V3' "$PKG"; then
            echo "::error file=${PKG}::_processor_opt default must be GENERIC_V3"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "PKGBUILD sanity checks passed"

  mainline-merged:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: mainline-merged
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Warn if mainline already has the MacBook8,1 SPI quirk
        env:
          MAINLINE_SPI_URL: https://raw.githubusercontent.com/torvalds/linux/master/drivers/spi/spi-pxa2xx-pci.c
        run: |
          set -euo pipefail
          SPI="${RUNNER_TEMP}/spi-pxa2xx-pci.c"
          curl -L --fail --retry 3 --retry-delay 5 --show-error \
            --connect-timeout 30 --max-time 120 \
            -o "$SPI" "$MAINLINE_SPI_URL"

          if grep -F 'MacBook8,1' "$SPI"; then
            echo "::warning title=Mainline already has MacBook8,1::torvalds/linux drivers/spi/spi-pxa2xx-pci.c contains MacBook8,1. Drop kernel/linux-cachyos-mb81/0001-spi-pxa2xx-pci-disable-dma-macbook8-1.patch after a human confirms keyboard/trackpad on official linux-cachyos."
            echo "=============================================================="
            echo "WARNING: Mainline has MacBook8,1 SPI quirk — our patch can be dropped"
            echo "Do not fail this job; a human must remove the patch."
            echo "=============================================================="
          else
            echo "Mainline spi-pxa2xx-pci.c does not mention MacBook8,1; keep the local PIO patch."
          fi

  ci:
    name: CI
    if: ${{ always() }}
    needs: [changes, shell-syntax, patch-applies, pkgbuild-sanity, mainline-merged]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require expected results
        env:
          ROUTE: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SHELL: ${{ needs.shell-syntax.result }}
          PATCH: ${{ needs.patch-applies.result }}
          PKG: ${{ needs.pkgbuild-sanity.result }}
          MAINLINE: ${{ needs.mainline-merged.result }}
        run: |
          test "$ROUTE" = success
          case "$CODE" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          for result in "$SHELL" "$PATCH" "$PKG" "$MAINLINE"; do
            test "$result" = "$expected"
          done
